<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Left ear -->
  <circle cx="7.5" cy="7" r="5" fill="#C9A67B"/>
  <circle cx="7.5" cy="7" r="2.5" fill="#DFC09A"/>
  <!-- Right ear -->
  <circle cx="24.5" cy="7" r="5" fill="#C9A67B"/>
  <circle cx="24.5" cy="7" r="2.5" fill="#DFC09A"/>
  <!-- Head -->
  <circle cx="16" cy="18" r="14" fill="#C9A67B"/>
  <!-- Muzzle area -->
  <ellipse cx="16" cy="21" rx="7" ry="5.5" fill="#DFC09A"/>
  <!-- Eyes -->
  <circle cx="11" cy="15.5" r="2.3" fill="#2C2C2C"/>
  <circle cx="21" cy="15.5" r="2.3" fill="#2C2C2C"/>
  <!-- Eye highlights -->
  <circle cx="11.8" cy="14.6" r="0.9" fill="#fff"/>
  <circle cx="21.8" cy="14.6" r="0.9" fill="#fff"/>
  <!-- Nose -->
  <ellipse cx="16" cy="20" rx="2.8" ry="2" fill="#96754D"/>
  <ellipse cx="15.6" cy="19.5" rx="1" ry="0.5" fill="#A8845E" opacity="0.6"/>
  <!-- Mouth -->
  <path d="M13.5 22.5 Q16 25.5 18.5 22.5" fill="none" stroke="#6B4F35" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Cheek blush -->
  <circle cx="7.5" cy="20.5" r="2.5" fill="#E8B4A0" opacity="0.35"/>
  <circle cx="24.5" cy="20.5" r="2.5" fill="#E8B4A0" opacity="0.35"/>
</svg>
